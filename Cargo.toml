[workspace]
resolver = "2"
members = [
    "crates/ic-core",
    "crates/ic-hash",
    "crates/ic-mac",
    "crates/ic-kdf",
    "crates/ic-cipher",
    "crates/ic-drbg",
    "crates/ic-ec",
    "crates/ic-rsa",
    "crates/ic-pkix",
    "crates/ic-mlkem",
    "crates/ic-mldsa",
    "crates/ic-json",
    "crates/ic-vectors",
    "crates/ic-fips",
    "crates/ic-ontology",
    "crates/iron-crypto",
    "crates/ic-cli",
    "crates/ic-rustls",
]

# Not a workspace member, and deliberately so. `bench/` compares this library
# against RustCrypto's, which means depending on RustCrypto; excluding it keeps
# that dependency out of the workspace graph entirely, so
# `scripts/no-third-party.sh` and the SBOM see exactly what they saw before. It
# is a measurement tool, not part of the library, and nothing ships from it.
exclude = ["bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/IronCrypto"
authors = ["Nervosys"]
keywords = ["cryptography", "fips", "no-std", "agentic", "post-quantum"]
categories = ["cryptography", "no-std"]

# Publishing this is an export. Encryption source code controlled under
# ECCN 5D002 requires notifying BIS and the NSA's ENC Encryption Request
# Coordinator of the URL before it is made public -- 15 CFR 742.15(b). That is
# a notification and not a licence application, but it has to come first, and
# nothing undoes a publish.
#
# This was off until the notification had been sent. It has been, so it is on.
#
# The record of what was sent and when belongs in `docs/export/`, per step 2 of
# docs/RELEASING.md -- so that "was notification given, and when" can be
# answered years from now without depending on one person's mailbox.
#
# `every_crate_publishes_together` in crates/ic-cli/src/sbom.rs still holds the
# line that matters now: no crate may set its own value and drift from the
# workspace, in either direction.
publish = true

[workspace.dependencies]
ic-core = { path = "crates/ic-core", version = "0.1.0", default-features = false }
ic-hash = { path = "crates/ic-hash", version = "0.1.0", default-features = false }
ic-mac = { path = "crates/ic-mac", version = "0.1.0", default-features = false }
ic-kdf = { path = "crates/ic-kdf", version = "0.1.0", default-features = false }
ic-cipher = { path = "crates/ic-cipher", version = "0.1.0", default-features = false }
ic-drbg = { path = "crates/ic-drbg", version = "0.1.0", default-features = false }
ic-ec = { path = "crates/ic-ec", version = "0.1.0", default-features = false }
ic-rsa = { path = "crates/ic-rsa", version = "0.1.0", default-features = false }
ic-pkix = { path = "crates/ic-pkix", version = "0.1.0", default-features = false }
ic-mlkem = { path = "crates/ic-mlkem", version = "0.1.0", default-features = false }
ic-mldsa = { path = "crates/ic-mldsa", version = "0.1.0", default-features = false }
ic-json = { path = "crates/ic-json", version = "0.1.0" }
ic-vectors = { path = "crates/ic-vectors", version = "0.1.0" }
ic-fips = { path = "crates/ic-fips", version = "0.1.0", default-features = false }
ic-ontology = { path = "crates/ic-ontology", version = "0.1.0", default-features = false }
iron-crypto = { path = "crates/iron-crypto", version = "0.1.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.bench]
lto = "fat"
codegen-units = 1
