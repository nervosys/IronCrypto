name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --release

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # -D warnings, or clippy reports problems and exits zero. Local runs
      # have always included it; CI did not, so the rule was enforced by
      # habit rather than by the build.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  aarch64-crypto:
    name: ARM crypto extensions (native)
    # macos-latest is arm64, so these tests run on hardware that has the
    # extensions and the runtime detection picks the ARM path. This is the only
    # place the intrinsics execute rather than merely compile -- they shipped
    # behind an off-by-default feature precisely because nothing could run them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm this really is arm64
        # Otherwise a runner image change could move this to x86 and the job
        # would keep passing while testing the portable backend instead.
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          test "$arch" = "arm64"
      - run: cargo test -p ic-cipher --features aarch64-crypto
      - run: cargo test -p iron-crypto --features aarch64-crypto

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf   # Cortex-M4F
          - thumbv6m-none-eabi      # Cortex-M0, no atomic CAS
          - riscv32imac-unknown-none-elf
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A --no-default-features build on a host with std proves nothing; these
      # targets have no std at all, so they are the real check.
      - run: cargo build -p iron-crypto --no-default-features --target ${{ matrix.target }}

  dependencies:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The same script the local gate runs, rather than a second copy of the
      # rule. The copy that used to live here listed the workspace crates by
      # name under the old `ac-` prefix, so after the rename it reported all
      # sixteen of them as third-party and this job failed on every push.
      - run: scripts/no-third-party.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
