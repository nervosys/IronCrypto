name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --release

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # -D warnings, or clippy reports problems and exits zero. Local runs
      # have always included it; CI did not, so the rule was enforced by
      # habit rather than by the build.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf   # Cortex-M4F
          - thumbv6m-none-eabi      # Cortex-M0, no atomic CAS
          - riscv32imac-unknown-none-elf
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A --no-default-features build on a host with std proves nothing; these
      # targets have no std at all, so they are the real check.
      - run: cargo build -p iron-crypto --no-default-features --target ${{ matrix.target }}

  dependencies:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The same script the local gate runs, rather than a second copy of the
      # rule. The copy that used to live here listed the workspace crates by
      # name under the old `ac-` prefix, so after the rename it reported all
      # sixteen of them as third-party and this job failed on every push.
      - run: scripts/no-third-party.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
