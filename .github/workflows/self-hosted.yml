name: self-hosted

# The same gate, on a runner this project provides.
#
# `ci.yml` uses GitHub-hosted runners, and for a time could not run at all: an
# account-level billing block rejected every job before it started. A
# self-hosted runner consumes no GitHub minutes, so this workflow kept a gate
# running through that, and is kept as the check that survives if billing
# lapses again. `ci.yml` is the primary gate: the three-OS matrix, 32-bit x86,
# ARM, and the four cross-compilation targets.
#
# It invokes scripts/check.sh rather than listing the steps. That is the whole
# design: CI used to write each step out again, its copy of the dependency check
# drifted onto crate names that no longer existed, and the job failed on every
# push. A workflow that calls the script cannot disagree with the script.

# Not on `pull_request`. The repository is public, so a pull request can come
# from anyone's fork, and one that ran here would run its author's code -- build
# scripts, tests, anything -- on the machine hosting the runner. `ci.yml` tests
# every pull request on GitHub's machines instead. What remains can be started
# only by someone with write access.
#
# Removing the trigger is not the whole defence and cannot be: a pull request
# runs the workflow files as the pull request has them, so its author can put
# the trigger back, or write a new workflow naming `self-hosted`. What stops
# that is the repository setting that holds every outside contributor's
# workflows for a maintainer's approval (`all_external_contributors`). Read the
# workflow changes in a pull request before approving it to run.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One machine, so queued pushes should supersede rather than pile up. The
  # in-progress run is left alone: a half-finished cargo build that is killed
  # leaves the target directory in a state the next run has to clean up.
  group: self-hosted-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default: no job here writes to the repository, and a token
# that cannot write is one a compromised step cannot misuse. Actions are pinned
# to commit SHAs rather than tags or branches, which their owners can move.
permissions:
  contents: read

jobs:
  check:
    name: full check
    runs-on: [self-hosted]
    # The gate builds four cross-compilation targets and the whole test suite
    # from cold on the first run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This machine persists between runs; leave no token in .git/config.
          persist-credentials: false

      # `shell: bash` resolves against PATH, and on a Windows machine PATH the
      # first `bash.exe` is `C:\Windows\System32\bash.exe` -- the WSL launcher,
      # which exits 1 when no distribution is installed. Git Bash is present but
      # in `Git\bin`, which the machine PATH does not carry; it carries
      # `Git\cmd`, which holds `git.exe` and not `bash.exe`.
      #
      # This matters only when the runner is a service. Run interactively it
      # inherits a user PATH that usually has Git Bash on it, so the failure
      # appears the first time the runner is installed properly.
      - name: Put Git Bash ahead of WSL on PATH
        shell: pwsh
        run: |
          $git = (Get-Command git -ErrorAction Stop).Source
          $root = $git
          while ($root -and (Split-Path -Leaf $root) -ne 'Git') {
            $root = Split-Path -Parent $root
          }
          if (-not $root) { throw "could not find the Git install root from $git" }
          $bin = Join-Path $root 'bin'
          if (-not (Test-Path (Join-Path $bin 'bash.exe'))) {
            throw "no bash.exe in $bin"
          }
          Write-Host "using $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # A self-hosted runner keeps whatever was installed last time, which is
      # why this is a check rather than an install: a toolchain that drifted on
      # the machine should be visible in the log, not silently used.
      - name: Report the toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          echo "installed targets:"
          rustup target list --installed
          echo "bash: $(command -v bash)"

      # check.sh names the four targets it wants and reports any that are
      # missing rather than skipping them quietly, so an absent one shows up in
      # the summary instead of passing as if it had been built.
      - name: Install the cross-compilation targets
        shell: bash
        run: |
          for target in thumbv7em-none-eabihf thumbv6m-none-eabi \
                        riscv32imac-unknown-none-elf wasm32-unknown-unknown; do
            rustup target add "$target"
          done

      - name: scripts/check.sh
        shell: bash
        # Kept out of the repository's own target directory: the runner may be
        # working in a directory a developer also builds in, and two cargo
        # processes sharing one target directory block on the same lock.
        env:
          CARGO_TERM_COLOR: always
          CARGO_TARGET_DIR: ${{ runner.temp }}/ironcrypto-target
          # rustdoc writes an args file to the temp directory, and on a Windows
          # machine that is the runner account's %LOCALAPPDATA%\Temp -- which on
          # this host grants the user no rights on the subdirectories it
          # creates, so the doctests fail with a bare
          # "failed to create args file: Access is denied".
          #
          # Pointing at the runner's own temp avoids the question entirely, and
          # is better practice regardless: build scratch belongs with the job
          # and is cleaned up with it, rather than accumulating in a profile.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: bash scripts/check.sh
