[package]
name = "ic-pkix"
description = "DER and PEM encoding for keys and signatures, for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std"]

[dependencies]
ic-core = { workspace = true }

# The fuzz harness base64-encodes its own PEM inputs.
[dev-dependencies]
ic-core = { workspace = true, features = ["std"] }
