[package]
name = "ac-pkix"
description = "DER and PEM encoding for keys and signatures, for AgenticCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["ac-core/std"]

[dependencies]
ac-core = { workspace = true }

# The fuzz harness base64-encodes its own PEM inputs.
[dev-dependencies]
ac-core = { workspace = true, features = ["std"] }
