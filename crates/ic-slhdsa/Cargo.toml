[package]
name = "ic-slhdsa"
description = "SLH-DSA (FIPS 205), the stateless hash-based signature standard, for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std", "ic-hash/std", "ic-mac/std"]

[dependencies]
ic-core = { workspace = true }
ic-hash = { workspace = true }
ic-mac = { workspace = true }

# For the documentation example's random source.
[dev-dependencies]
ic-drbg = { workspace = true, features = ["std"] }
