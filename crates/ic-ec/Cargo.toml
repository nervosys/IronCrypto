[package]
name = "ic-ec"
description = "X25519, Ed25519, and elliptic-curve arithmetic for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std", "ic-hash/std", "ic-mac/std"]
# Internals that `bench/` needs to time in isolation. The benchmark lives
# outside the workspace, so it cannot reach private items; this is how it gets
# them without their being public API for everyone else. Not covered by semver.
bench-internals = ["std"]
# P-256 field and scalar operations for `scripts/ct-audit`, which inspects their
# compiled code. Also not API and not covered by semver.
ct-probes = []

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
# `ic_limb32` selects the 32-bit-limb Curve25519 field on any target; see
# `src/field32.rs`.
# `ic_ec_portable` leaves out the x86-64 MULX/ADX Curve25519 field, so that the
# whole test suite runs on the portable one; see `src/fe64.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_limb32)", "cfg(ic_approved_only)", "cfg(ic_ec_portable)"] }

[[test]]
# Its own process, without the harness: it counts allocations, and only the
# first use of each table is the case it is about.
name = "cold_tables"
harness = false
required-features = ["std"]

[dependencies]
ic-core = { workspace = true }
ic-hash = { workspace = true }
ic-mac = { workspace = true }
