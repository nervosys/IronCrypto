[package]
name = "ic-core"
description = "Core traits, errors, constant-time primitives, and zeroization for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = []
alloc = []
# Not for direct use: turned on by ic-cipher's `aarch64-crypto`, so that
# `cpu::has_armv8_aes` and `cpu::has_ghash_pmull` -- which the ontology reports
# from and ic-cipher dispatches on -- answer for the backends that build has.
aarch64-crypto = []

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_approved_only)", "cfg(ic_startup_gate_off)", "cfg(kani)"] }

[dependencies]
