[package]
name = "ic-mac"
description = "HMAC, CMAC, KMAC, and Poly1305 message authentication for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std", "ic-hash/std", "ic-cipher/std"]

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_approved_only)"] }

[dependencies]
ic-core = { workspace = true }
ic-hash = { workspace = true }
ic-cipher = { workspace = true }
