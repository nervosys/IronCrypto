[package]
name = "ac-cli"
description = "acrypto: command-line and MCP-server front end for AgenticCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "acrypto"
path = "src/main.rs"

[dependencies]
agentic-crypto = { workspace = true, features = ["std"] }
ac-ontology = { workspace = true, features = ["std"] }
ac-core = { workspace = true, features = ["std"] }
ac-hash = { workspace = true, features = ["std"] }
ac-mac = { workspace = true, features = ["std"] }
ac-cipher = { workspace = true, features = ["std"] }
ac-drbg = { workspace = true, features = ["std"] }
ac-fips = { workspace = true, features = ["std"] }
ac-pkix = { workspace = true, features = ["std"] }
