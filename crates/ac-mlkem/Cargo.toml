[package]
name = "ac-mlkem"
description = "ML-KEM (FIPS 203) for AgenticCrypto - experimental, not vector-tested"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["ac-core/std", "ac-hash/std"]

[dependencies]
ac-core = { workspace = true }
ac-hash = { workspace = true }

# Only the tests need a DRBG; the library takes any `RandomSource`.
[dev-dependencies]
ac-drbg = { workspace = true, features = ["std"] }
