[package]
name = "ic-hash"
description = "SHA-2, SHA-3, and SHAKE implementations for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std"]
# The ARMv8 SHA-256 and SHA-512 backends (sha2/aarch64.rs). Off by default, as
# ic-cipher's ARMv8 AES backend is: they have run under QEMU user-mode
# emulation (scripts/test-aarch64.sh) and not yet on ARM hardware. Needs `std`
# for runtime detection; without it the feature selects nothing.
aarch64-crypto = []

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_approved_only)"] }

[dependencies]
ic-core = { workspace = true }
