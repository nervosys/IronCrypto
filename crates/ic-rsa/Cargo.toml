[package]
name = "ic-rsa"
description = "RSA signatures and key generation for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std", "ic-hash/std"]

# `ic_limb32` selects the 32-bit word arithmetic on any target; see
# `src/uint.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_limb32)"] }

[dependencies]
ic-core = { workspace = true }
ic-hash = { workspace = true }

# Signing and key generation take any `ic_core::traits::RandomSource`, so the
# DRBG is needed only to run the tests and the doc examples.
[dev-dependencies]
ic-drbg = { workspace = true, features = ["std"] }
