[package]
name = "ac-rsa"
description = "RSA signatures and key generation for AgenticCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["ac-core/std", "ac-hash/std"]

[dependencies]
ac-core = { workspace = true }
ac-hash = { workspace = true }

# Signing and key generation take any `ac_core::traits::RandomSource`, so the
# DRBG is needed only to run the tests and the doc examples.
[dev-dependencies]
ac-drbg = { workspace = true, features = ["std"] }
