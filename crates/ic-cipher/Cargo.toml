[package]
name = "ic-cipher"
description = "AES, AES-GCM, ChaCha20-Poly1305, and block modes for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std"]
# The ARMv8 AES backend. Off by default because it has never been executed:
# it was written on x86, and CI -- which would run it on an arm64 macOS runner
# with --all-features -- has been blocked at the account level and has not run
# at all. It compiles, which was unknown until it was tried.
#
# What argues it is correct meanwhile is aes/armv8_model.rs, a software model of
# the instructions checked against the AES vectors; that model is what caught
# the decryption key schedule being wrong. It becomes the default once the
# arm64 job has actually passed.
aarch64-crypto = []
# Exposes `ct_probes`: the x86-64 ChaCha20 and Poly1305 kernels, wrapped for
# scripts/ct-audit to compile and read. Not for use; see docs/CONSTANT_TIME.md.
ct-probes = []

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_approved_only)", "cfg(ic_no_avx512)", "cfg(ic_no_vaes)"] }

[dependencies]
ic-core = { workspace = true }
