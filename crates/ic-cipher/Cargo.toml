[package]
name = "ic-cipher"
description = "AES, AES-GCM, ChaCha20-Poly1305, and block modes for IronCrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["ic-core/std"]
# The ARMv8 AES backend and the PMULL GHASH backend. Off by default because
# neither has run on ARM hardware: they were written on x86, and CI -- which
# would run them on an arm64 macOS runner with --all-features -- has been
# blocked at the account level and has not run at all.
#
# They have run under QEMU user-mode emulation (scripts/test-aarch64.sh), which
# checks what the instructions compute as QEMU models them. Software models of
# the instructions (aes/armv8_model.rs, armv8_ghash_model.rs) check the
# structure on any host; the AES one is what caught the decryption key schedule
# being wrong. It becomes the default once the arm64 job has actually passed.
#
# Forwarded to ic-core so the ontology's backend report sees it.
aarch64-crypto = ["ic-core/aarch64-crypto"]
# Exposes `ct_probes`: the x86-64 ChaCha20 and Poly1305 kernels, wrapped for
# scripts/ct-audit to compile and read. Not for use; see docs/CONSTANT_TIME.md.
ct-probes = []

# `ic_approved_only` leaves out every algorithm FIPS approved mode does not
# permit; see docs/FIPS.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ic_approved_only)"] }

[dependencies]
ic-core = { workspace = true }
