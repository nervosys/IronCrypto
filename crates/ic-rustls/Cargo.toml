[package]
name = "ic-rustls"
description = "IronCrypto as a rustls CryptoProvider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["cryptography", "tls", "rustls", "fips"]
categories = ["cryptography", "network-programming"]
publish.workspace = true

[dependencies]
ic-core = { workspace = true, features = ["std"] }
ic-hash = { workspace = true, features = ["std"] }
ic-mac = { workspace = true, features = ["std"] }
ic-cipher = { workspace = true, features = ["std"] }
ic-drbg = { workspace = true, features = ["std"] }
ic-ec = { workspace = true, features = ["std"] }
ic-rsa = { workspace = true, features = ["std"] }
ic-pkix = { workspace = true, features = ["std"] }

# The one third-party dependency in this workspace, and the reason this crate
# is separate from every other one. See the module documentation.
# `tls12` for the TLS 1.2 suites; without it rustls has no `Tls12CipherSuite`
# and no `Iv::new`. Nothing else is enabled: no default provider, no logging,
# so this pulls in rustls and its three required crates and nothing further.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
